                <div class="score">wait...</div>

                <div class="score">wait...</div>
                <div class="score">wait...</div>
                <div class="score">wait...</div>
            </div>
            </div>
            <div class="scoreboard">
                <h2>Best local scores</h2>
                <div class="score-list" id="localScores">
                    <div class="score">N/A</div>
                    <div class="score">N/A</div>
                    <div class="score">N/A</div>
                    <div class="score">N/A</div>
                    <div class="score">N/A</div>
                </div>
            </div>
            <div class="scoreboard">
                <h2>Last local scores</h2>
                <div class="score-list" id="lastLocalScores">
                    <div class="score">N/A</div>
                    <div class="score">N/A</div>
                    <div class="score">N/A</div>
                    <div class="score">N/A</div>
                    <div class="score">N/A</div>
                </div>
            </div>
            <div class="buttonsList">
                <div class="scoreboard">
                    <a href="https://github.com/Lolo280374/clicksiege/">
                        <button>learn more!</button>
                    </a>
                    <a>
                        <br><button id="switchColorProfile">switch color palette</button>
                    </a>
                    <!-- I need to add light mode, ranked, and localstorage db !-->
                    <a href="https://docs.google.com/spreadsheets/d/1Cse2rNzUCi0-1UKvLzwNGUPKf67qBgiwusbWDcmAJYU/edit?usp=sharing">
                        <br><button>browse ranked backend</button>
                    </a>
                    <a href="https://click.lolodotzip.tech/privacy.html/">
                        <br><button>privacy policy</button>
                    </a>
                    <a href="https://www.youtube.com/watch?v=xvFZjo5PgG0">
                        <br><button>i dunno</button>
                    </a>
